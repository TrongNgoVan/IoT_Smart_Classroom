<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='avatar.ico') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng học thông minh</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        .header {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            width: 100%;
            padding: 10px 20px;
            background-color: #b10404;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        .header .logo {
            margin-right: 20px;
        }

        .header .logo img {
            height: 50px;
            vertical-align: middle;
        }

        .header .user-info {
            display: flex;
            align-items: center;
            padding-left: 20px;
        }

        .header .user-info img {
            height: 50px;
            width: 50px;
            border-radius: 50%;
            margin-right: 10px;
            object-fit: cover;
        }

        .header .account-details {
            text-align: left;
        }

        .header .account-details a {
            text-decoration: none;
            color: #fefefe;
            display: block;
            line-height: 1.4;
        }

        .header .account-details a:hover {
            color: #e0e0e0;
        }

        .container {
            text-align: center;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
            width: 80%;
            max-width: 900px;
        }

        h1 {
            color: #333;
        }

      

        .view-btn {
            padding: 10px 20px;
            background-color: #b10404;
            color: white;
            font-size: 16px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }

        .view-btn:hover {
            background-color: #8a0303;
        }
    </style>
</head>
<body>

<!-- Header Section -->
<div class="header" id="header">
    <div class="logo">
        <a href="/">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
        </a>
    </div>
    <div class="user-info">
        <img src="{{ url_for('static', filename='l/avatar.jpg') }}" alt="Account Icon">
        <div class="account-details">
            <b><a href="https://www.facebook.com/ngovantrong1308?locale=vi_VN">Ngọ Văn Trọng</a></b>
            <a href="https://github.com/TrongNgoVan">B21DCCN726</a>
        </div>
    </div>
</div>

<!-- Main Content Section -->
<div class="container">
    <h1>Web quản lý phòng học thông minh</h1>

    <!-- Nút xem danh sách sinh viên -->
    <a href="/students" class="view-btn">Xem danh sách sinh viên</a>

    <!-- Display student list -->
   
</div>

</body>
</html>
